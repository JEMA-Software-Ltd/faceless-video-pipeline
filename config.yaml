# config.yaml — tunable knobs for the pipeline.
# Secrets do NOT live here; they live in .env (see .env.example).

video:
  # Output resolution and frame rate. 1920x1080 @ 25fps per the render spec.
  width: 1920
  height: 1080
  fps: 25
  # Ken Burns pace. images.py picks one image per `seconds_per_image` of a
  # chunk's *measured* audio, clamped to [min, max]. Spec: one image / 8-12s.
  seconds_per_image: 10
  min_seconds_per_image: 8
  max_seconds_per_image: 12
  # Deterministic per-image timing variation. 0 preserves equal splits;
  # 0.3 permits up to +/-30%, while render.py still clamps shots to 4..15s.
  pace_variation: 0.0
  # x264 knobs for the per-clip encode (the only encode that happens; the
  # concat + final mux both copy the video stream).
  crf: 20
  preset: medium

tts:
  # Which synthesiser to use: "kokoro" (local model) or "edge" (Microsoft Edge
  # read-aloud endpoint). Both produce one wav per chunk with identical timing
  # semantics; only the voice differs. Kokoro needs no network but does need
  # espeak-ng and a ~82MB model download; edge needs no local model but IS a
  # network call to an undocumented endpoint, so it can fail or change.
  backend: edge

  # --- kokoro backend ---
  # 'b*' voices are British English (bf_* female, bm_* male). lang_code 'b' =
  # British English.
  voice: bm_daniel
  lang_code: b
  speed: 0.9

  # --- edge backend ---
  # Voice must appear in `edge-tts --list-voices`; doctor.py checks this against
  # the live list. rate/pitch are the endpoint's own percentage/Hz offsets.
  edge_voice: en-GB-RyanNeural
  edge_rate: "-8%"
  edge_pitch: "+0Hz"

  # Output sample rate. Kokoro emits 24kHz natively; edge returns mp3 which is
  # resampled to this before the wav is written.
  sample_rate: 24000
  # Silence appended to the END of every chunk's wav, in seconds. This is baked
  # into the wav itself, so the duration tts.py measures (and writes back to
  # chunks.json) already includes it — the image timeline in render.py tracks
  # the padded audio and cannot drift. 0 disables padding.
  pause_after_chunk: 0.5

llm:
  # Local production-assistance model. It only makes production decisions
  # (currently stock-search keywords); it never writes or edits narration.
  # Every use has a deterministic heuristic fallback, so a stopped Ollama
  # service or missing model reduces quality but never stops the pipeline.
  enabled: false
  backend: ollama
  host: http://localhost:11434
  model: qwen3.5:4b
  timeout_seconds: 120
  context: 4096
  max_retries: 2
  keywords_per_chunk: 3

images:
  per_page: 20              # candidates to pull per query before picking.
  orientation: landscape    # Pexels term; Pixabay equivalent is 'horizontal'.
  min_width: 1920
  min_height: 1080
  # Appended to every Pexels AND Pixabay query, after the chunk's keywords, to
  # bias the whole video toward one consistent look. Set to "" to disable.
  query_suffix: "documentary cinematic"

grade:
  # Colour grade applied per clip in render.py: after the Ken Burns zoompan,
  # before the encode. Set enabled: false to skip it entirely (the filter chain
  # is then byte-identical to an ungraded render).
  enabled: true
  # eq: 1.0 is neutral for all three. saturation < 1 drains colour; gamma < 1
  # darkens the midtones.
  saturation: 0.88
  contrast: 1.10
  gamma: 0.96
  # colorbalance, shadows only (midtones and highlights are left alone).
  # Range -1..1 per channel. Negative red + positive blue = cool shadows.
  shadow_tint:
    r: -0.04
    g: -0.01
    b: 0.07
  vignette: true
  # ffmpeg vignette angle in RADIANS. Its own default is PI/5 (~0.63);
  # lower = softer / less corner falloff.
  vignette_angle: 0.45

captions:
  # Burned-in captions are OFF by default (spec). When enabled, FONT_PATH in
  # .env must point at a real .ttf/.otf — drawtext needs an absolute path.
  enabled: false
  font_size: 44
  font_colour: white
  border_width: 3
  border_colour: black
  bottom_margin: 90
  max_chars_per_line: 48

audio:
  # Final-mux audio polish. The master switch is OFF by default.
  enabled: false
  normalise: true
  compress: true
  target_lufs: -16
  highpass_hz: 80
  presence_hz: 3000
  presence_gain_db: 2
  # Optional user-supplied, properly licensed music. No track is bundled or
  # selected by the pipeline, and this empty path leaves the branch inactive.
  music_path: ""
  music_gain_db: -26
  duck_db: -3

overlays:
  # Spoken-number overlays. Disabled preserves the existing visual render.
  enabled: false
  max_per_chunk: 1
  font_size: 96
  duration: 2.5

charts:
  # Candidate generation is standalone; charts are not wired into render.py.
  enabled: false
  max_per_video: 6
  min_ratio: 1.5

clips:
  # Standalone vertical-clip stage. Disabled keeps existing runs unchanged.
  enabled: false
  count: 6
  min_seconds: 15
  max_seconds: 55
  force_chunks: []

upload:
  privacy: private          # Always private; publishAt controls going live.
  publish_time: "17:00"     # Local wall-clock time in `timezone`.
  timezone: Europe/London   # Handles GMT/BST automatically via zoneinfo.
  category_id: 22           # 22 = People & Blogs. See the YouTube API docs for
                            # the full videoCategory list for your region.
  made_for_kids: false
  # Channel-level tags applied to EVERY upload, before any per-script tags from
  # the markdown `<!-- tags: ... -->` comment. Replace these with your own.
  tags:
    - example tag one
    - example tag two
  # Fallback description, used only when a script has no `<!-- description: -->`
  # comment. Replace with your own; add any disclaimer your subject matter needs.
  default_description: |
    Replace this with your channel's default description.

qc:
  audio_video_max_diff: 0.5   # seconds; fail if |audio - video| exceeds this.
  black_max_duration: 0.5     # seconds; fail on any black segment longer.
  black_pixel_threshold: 0.10 # blackdetect pix_th (lower = stricter "black").
  sample_frames: 10           # evenly spaced frames to inspect.
  single_colour_threshold: 0.95  # fail a frame if one colour covers > this.
  min_kbps: 200               # implausibly small file => broken render.
  max_kbps: 12000             # implausibly large file => something wrong.

dry_run:
  # CRITICAL: dry-run makes a ~30s video from a few chunks so the whole chain
  # can be validated in under two minutes before trusting a full 15-min encode.
  num_chunks: 3
  truncate_chars: 220   # cap each chunk's narration text so TTS stays short.
  target_seconds: 30    # informational; actual length follows measured audio.
